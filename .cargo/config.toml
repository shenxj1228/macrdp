[env]
# ScreenCaptureKit requires macOS 14+. Setting the deployment target here keeps
# rustc/swiftc from emitting @rpath/libswift_Concurrency.dylib back-deploy
# dependencies; macOS 14+ ships Swift Concurrency in the system runtime.
# Do NOT set DYLD_LIBRARY_PATH here: it leaks into rustc/build-script/swift
# subprocesses and breaks builds on macOS 26 and Intel/OCLP machines.
MACOSX_DEPLOYMENT_TARGET = "14.0"
