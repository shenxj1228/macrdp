name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Full Xcode is not required: the project only links the system Swift runtime (no swiftc
    # build step). macOS runners ship Xcode anyway.
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            macrdp-ui/src-tauri

      - name: Toolchain info
        run: |
          xcodebuild -version
          swift --version
          cargo --version

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: macrdp-ui/package-lock.json

      - name: Build frontend
        run: cd macrdp-ui && npm ci && npm run build

      - name: Build Tauri app (no bundle)
        run: cd macrdp-ui && npm run tauri -- build --no-bundle
