name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: aarch64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            macrdp-ui/src-tauri

      - name: Toolchain info
        run: |
          xcodebuild -version
          swift --version

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: macrdp-ui/package-lock.json

      - name: Install frontend dependencies
        run: cd macrdp-ui && npm ci

      # Import the self-signed certificate used to give the app a stable signing
      # identity across releases (TCC grants are keyed to the certificate root).
      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Secrets pasted from `pbcopy` may carry a trailing newline, which
          # makes `security import` fail with a misleading "wrong password".
          CERTIFICATE_BASE64="$(printf '%s' "$CERTIFICATE_BASE64" | tr -d '\r\n')"
          CERTIFICATE_PASSWORD="$(printf '%s' "$CERTIFICATE_PASSWORD" | tr -d '\r\n')"
          if [ -z "$CERTIFICATE_BASE64" ] || [ -z "$CERTIFICATE_PASSWORD" ]; then
            echo "::error::APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD secrets are not set"
            exit 1
          fi
          CERT_PATH="$RUNNER_TEMP/macrdp-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/macrdp-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$CERT_PATH"
          if [ "$(wc -c < "$CERT_PATH" | tr -d ' ')" -lt 100 ]; then
            echo "::error::APPLE_CERTIFICATE did not decode to a valid .p12"
            exit 1
          fi
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning
          rm -f "$CERT_PATH"

      - name: Build CLI (release)
        run: cargo build -p macrdp-server --release

      - name: Build UI + DMG
        run: >
          cd macrdp-ui && npm run tauri -- build
          --config '{"bundle":{"macOS":{"signingIdentity":"macrdp Self-Signed"}}}'

      - name: Verify app signature
        run: |
          APP="macrdp-ui/src-tauri/target/release/bundle/macos/macrdp.app"
          codesign --verify --deep --strict "$APP"
          codesign -dvv "$APP" 2>&1 | grep -F "Authority=macrdp Self-Signed"
          codesign -dr - "$APP" 2>&1 | grep -F "certificate root"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macrdp-${{ matrix.arch }}
          path: macrdp-ui/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: macrdp-server-${{ matrix.arch }}
          path: target/release/macrdp-server
          if-no-files-found: error

  release:
    needs: build-macos
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/macrdp-aarch64/*.dmg
            artifacts/macrdp-server-aarch64/macrdp-server
