name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: aarch64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            macrdp-ui/src-tauri

      - name: Toolchain info
        run: |
          xcodebuild -version
          swift --version

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: macrdp-ui/package-lock.json

      - name: Install frontend dependencies
        run: cd macrdp-ui && npm ci

      - name: Build CLI (release)
        run: cargo build -p macrdp-server --release

      # tauri.conf.json signs ad-hoc (signingIdentity: "-"), no cert needed in CI.
      - name: Build UI + DMG
        run: cd macrdp-ui && npm run tauri -- build

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macrdp-${{ matrix.arch }}
          path: macrdp-ui/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: macrdp-server-${{ matrix.arch }}
          path: target/release/macrdp-server
          if-no-files-found: error

  release:
    needs: build-macos
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/macrdp-aarch64/*.dmg
            artifacts/macrdp-server-aarch64/macrdp-server
