# macrdp 服务端配置文件
# 将此文件复制为 config.toml 并根据需要修改
# 配置文件搜索顺序: ./config.toml → ~/.config/macrdp/ → ~/Library/Application Support/macrdp/

# ─── 网络 ─────────────────────────────────────────────────────────────────────

# 监听端口
# 默认值: 3389 (RDP 标准端口, 1024 以下需要 sudo 权限)
# 可选值: 任意有效端口号 (建议 1024-65535)
port = 13389

# ─── 认证 ─────────────────────────────────────────────────────────────────────

# RDP 登录凭据 (NLA/Hybrid/CredSSP 认证)
# 用户名或密码留空时，服务端会使用 "Admin" + 随机生成的密码，而不是接受任意凭据
username = "admin"
password = "123456"

# ─── 显示 ─────────────────────────────────────────────────────────────────────

# 分辨率宽度 (像素)
# 默认值: 0 (自动检测 macOS 显示器分辨率, 并跟随客户端请求)
# 设置具体值 (如 1920) 则强制使用固定分辨率, 忽略客户端请求
width = 0

# 分辨率高度 (像素)
# 默认值: 0 (自动检测 macOS 显示器分辨率, 并跟随客户端请求)
# 设置具体值 (如 1080) 则强制使用固定分辨率, 忽略客户端请求
height = 0

# 目标帧率
# 默认值: 60
# 可选值: 30, 60, 120
frame_rate = 60

# 目标码率 (Mbps, 默认: 根据分辨率/帧率/质量自动计算)
# 手动设置后, 自适应质量仍会根据网络状况在此上限内调整
# bitrate_mbps = 50

# 会话分辨率
# 默认值: "auto"（自动检测显示器的物理像素，含 Retina 缩放）；"auto" 同时跟随客户端窗口大小
# "WxH" 值会固定会话分辨率，客户端无法覆盖。高 DPI 客户端（如 mstsc 150% 缩放）的逻辑窗口
# 小于物理屏幕，不固定时画面会按 1:1 显示在全屏窗口中，四周出现黑边。
# resolution = "3840x2160"

# 服务运行期间保持显示器常亮
# 默认值: false
# 默认设置下息屏会同时锁屏。为 false 时客户端连上会自动唤醒屏幕；锁屏界面仍可远程输入
# 密码解锁（除非有应用占用 Secure Input），但重启/注销后真正的系统登录窗口只能查看、
# 无法远程操作。设为 true 则整个会话期间显示器不休眠。
# keep_display_awake = true

# ─── 编码 ─────────────────────────────────────────────────────────────────────

# 视频质量预设
# 默认值: high_quality
# 可选值:
#   "low_latency"  — 低码率, 最快编码 (1080p30 约 16 Mbps)
#   "balanced"     — 平衡画质与码率 (1080p30 约 33 Mbps)
#   "high_quality" — 最佳画质, 较高码率 (1080p30 约 50 Mbps)
quality = "high_quality"

# H.264 编码器选择
# 默认值: software
# 可选值:
#   "software"  — OpenH264 软件编码 (CPU), 支持 P 帧, 编码延迟约 40ms
#   "hardware"  — VideoToolbox 硬件编码 (GPU), 编码延迟约 6ms, 仅 macOS
#   "auto"      — 等同于 software
encoder = "hardware"

# 色度采样模式
# 默认值: avc420
# 可选值:
#   "avc420" — 标准 YUV 4:2:0 色度采样 (兼容所有 RDP 客户端)
#   "avc444" — 完整 YUV 4:4:4 色度, 通过双流 AVC444 传输 (需要 V10+ 客户端, 画质最佳)
# chroma_mode = "avc420"

# ─── TLS 证书 ──────────────────────────────────────────────────────────────────

# TLS 证书文件路径 (PEM 格式)
# 默认值: 自动生成自签名证书
# cert_path = "/path/to/cert.pem"

# TLS 私钥文件路径 (PEM 格式)
# 默认值: 随证书一起自动生成
# key_path = "/path/to/key.pem"

# ─── 日志 ─────────────────────────────────────────────────────────────────────

# 日志级别
# 默认值: info
# 可选值: trace, debug, info, warn, error
log_level = "info"

# ─── 会话 ─────────────────────────────────────────────────────────────────────

# 空闲超时时间 (秒), 无输入操作后自动断开连接
# 默认值: 1800 (30 分钟)
idle_timeout_secs = 1800

# ─── 键盘 ─────────────────────────────────────────────────────────────────────

# Windows 客户端修饰键映射方式
# 默认值: shortcut
# 可选值:
#   "shortcut" — Windows 按键习惯: Ctrl→Command ⌘, Alt→Option ⌥, Win→Control。
#                Ctrl+C 复制、Ctrl+V 粘贴、Ctrl+Delete 删除文件。
#   "position" — 按物理位置: Ctrl→Control, Alt→Command ⌘, Win→Option ⌥。
[keyboard]
modifier_mapping = "shortcut"
