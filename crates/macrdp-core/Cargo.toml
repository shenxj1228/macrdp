[package]
name = "macrdp-core"
version = "0.1.0"
edition.workspace = true

[dependencies]
macrdp-capture = { path = "../macrdp-capture" }
macrdp-input = { path = "../macrdp-input" }
macrdp-encode = { path = "../macrdp-encode" }
macrdp-audio = { path = "../macrdp-audio" }
macrdp-clipboard = { path = "../macrdp-clipboard" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
bytes.workspace = true
ironrdp-server = { version = "0.10", features = ["helper"] }
async-trait = "0.1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rcgen = "0.13"
dirs = "6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSCursor", "NSImage", "NSImageRep", "NSGraphicsContext", "objc2-core-graphics"] }
objc2-core-graphics = "0.3"
core-graphics = "0.25"
foreign-types = "0.5"

[dev-dependencies]
tempfile = "3"
